<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin | VillianStudio</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header class="navbar">
        <div class="logo">VILLIANSTUDIO</div>

        <a href="index.html" class="admin-btn">
            Back to Website
        </a>
    </header>


    <main>

        <section class="admin-page">

            <div class="section-label">
                ADMIN ACCESS
            </div>

            <div class="admin-login-box">

                <h1>
                    Welcome <span>Admin</span>
                </h1>

                <p>
                    Enter your password to access the VillianStudio
                    content management area.
                </p>

                <form id="adminLoginForm">

                    <label for="adminPassword">
                        Password
                    </label>

                    <input
                        type="password"
                        id="adminPassword"
                        placeholder="Enter admin password"
                        required
                    >

                    <button type="submit" class="primary-btn">
                        Login
                    </button>

                    <p id="loginMessage"></p>

                </form>

            </div>

        </section>

    </main>


    <footer>

        <div class="footer-logo">
            VILLIANSTUDIO
        </div>

        <p>
            Music • Films • Visuals • Stories
        </p>

        <p class="copyright">
            © 2026 VillianStudio. All rights reserved.
        </p>

    </footer>

    <script src="script.js"></script>

</body>
</html>
